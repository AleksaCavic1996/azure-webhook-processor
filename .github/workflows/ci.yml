name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running workflow pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The cache key changes whenever a package version changes in any project.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Warnings fail the build, so they cannot pile up unnoticed.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # The integration tests start PostgreSQL with Testcontainers, using the runner's Docker.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release --results-directory TestResults
          -- --filter-not-trait "Category=EndToEnd" --report-xunit-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  end-to-end:
    name: End-to-end tests (Service Bus emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Starts the Service Bus emulator, its SQL Server and PostgreSQL. Running it accepts the
      # emulator license terms, see .env.example for the links.
      - name: Test
        run: >
          dotnet test --configuration Release --results-directory TestResults
          -- --filter-trait "Category=EndToEnd" --report-xunit-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Images are built on every run, so a broken Dockerfile fails a pull request.
  # They are pushed only from main, and only after every test passed.
  publish-images:
    name: Build ${{ matrix.app }} image, publish to GHCR from main
    needs: [build-and-test, end-to-end]
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker]
        include:
          - app: api
            dockerfile: src/WebhookProcessor.Api/Dockerfile
          - app: worker
            dockerfile: src/WebhookProcessor.Worker/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is enough to push to this repository's packages. No stored credentials.
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image gets the commit SHA as a tag, so a deployment can name exactly what it runs.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/webhook-processor-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
