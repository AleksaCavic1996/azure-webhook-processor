name: webhook-processor

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subfolder of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Backend storage required by the Service Bus emulator. Not used by the application.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA in .env}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      ACCEPT_EULA: ${ACCEPT_EULA:?set ACCEPT_EULA in .env}
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      mssql:
        condition: service_healthy

  # The application itself, built from the Dockerfiles. Started only on request:
  #   docker compose --profile app up -d --build
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/WebhookProcessor.Api/Dockerfile
    image: webhook-processor-api:local
    environment:
      ConnectionStrings__ServiceBus: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      Webhook__SigningSecret: ${WEBHOOK_SIGNING_SECRET:?set WEBHOOK_SIGNING_SECRET in .env}
    ports:
      - "8080:8080"
    depends_on:
      - servicebus

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: src/WebhookProcessor.Worker/Dockerfile
    image: webhook-processor-worker:local
    environment:
      ConnectionStrings__ServiceBus: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=webhooks;Username=webhooks;Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      servicebus:
        condition: service_started

volumes:
  postgres-data:
